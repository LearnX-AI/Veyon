# Veyon Policy Agent configuration
# Copy to /etc/veyon-policy-agent/config.conf and edit values.

# REQUIRED: URL of the central control server (no trailing slash).
server_url = http://192.168.1.100:8000

# REQUIRED: bearer token configured on the central server.
# Treat this like a password - do not commit to source control.
admin_token = REPLACE_WITH_REAL_TOKEN

# Optional: override the hostname this PC registers as.
# Defaults to the OS hostname.
# hostname = lab-pc-12

# Optional: how often to poll the server (seconds, minimum 5).
# heartbeat_interval_seconds = 30

# Optional: where to write blocked entries.
# Default is /etc/hosts. For testing, point at a sandbox file.
# hosts_file = /etc/hosts

# Optional: where distributed files land on this PC.
# Default is /var/lib/veyon/files/distributed (created automatically).
# file_destination_dir = /var/lib/veyon/files/distributed

# Optional: how often to poll the server for new files (seconds, minimum 2).
# file_check_interval_seconds = 10

# Optional: root directory where students drop submission files.
# A subdirectory is created per assigned shared folder.
# Default: /var/lib/veyon/submissions
# submissions_root_dir = /var/lib/veyon/submissions

# Optional: how often to sync shared folder state and check for new
# submissions (seconds, minimum 5). Default: 15
# folder_sync_interval_seconds = 15
