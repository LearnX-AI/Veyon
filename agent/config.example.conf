# Veyon Policy Agent configuration
# Copy to /etc/veyon-policy-agent/config.conf and edit values.

# REQUIRED: URL of the central control server (no trailing slash).
server_url = http://192.168.1.100:8000

# REQUIRED: bearer token configured on the central server.
# Treat this like a password - do not commit to source control.
admin_token = REPLACE_WITH_REAL_TOKEN

# Optional: override the hostname this PC registers as.
# Defaults to the OS hostname.
# hostname = lab-pc-12

# Optional: how often to poll the server (seconds, minimum 5).
# heartbeat_interval_seconds = 30

# Optional: where to write blocked entries.
# Default is /etc/hosts. For testing, point at a sandbox file.
# hosts_file = /etc/hosts
